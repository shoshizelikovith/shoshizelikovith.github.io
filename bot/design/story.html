<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סטורי מהמאמנת הדיגיטלית</title>
<!--
  סטורי עדות 1080x1920 בעיצוב אשה ללא מאמץ, כמו צילום מסך של שיחה עם המאמנת הדיגיטלית.
  נתונים: story.html?d=<base64url של JSON {title, quote, botLine, footer}>
    title   - הכותרת העליונה
    quote   - מה שהתלמידה כתבה (בועה סגולה, מימין). בלי שם ובלי תמונה שלה.
    botLine - לא חובה. תשובה קצרה של הבוטית (בועת קרם, משמאל).
    footer  - לא חובה. ברירת מחדל ״אשה ללא מאמץ״.
  בלי פרמטר - נתוני דוגמה.
  יצירת קישור:  'story.html?d=' + IshaStory.encode({title:'...', quote:'...'})
  צריך לצידו: isha-card.js, fonts/, img/logo.png, img/coach-avatar.jpg
-->
<style>
@font-face{font-family:'Assistant';font-style:normal;font-weight:200 800;font-display:block;
  src:url(fonts/assistant-hebrew.woff2) format('woff2');
  unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Assistant';font-style:normal;font-weight:200 800;font-display:block;
  src:url(fonts/assistant-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--cream:#F2EEE3;--soft:#F8F5EE;--ink:#0D122C;--purple:#A62F7D;--pink:#DF1767}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Assistant',sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 16px 24px}
#story{display:block;height:auto;
  width:min(100%, calc((100dvh - 120px) * 1080 / 1920), 420px);
  border-radius:14px;box-shadow:0 1px 2px rgba(13,18,44,.06),0 10px 30px rgba(13,18,44,.12)}
#save{font:700 18px 'Assistant',sans-serif;color:var(--cream);background:var(--purple);border:0;border-radius:999px;
  padding:13px 34px;cursor:pointer;box-shadow:0 6px 18px rgba(166,47,125,.25)}
#save:disabled{opacity:.6}
#note{margin:0;font-size:14px;opacity:.7;text-align:center}
</style>
</head>
<body>
<canvas id="story" width="1080" height="1920" aria-label="סטורי מהמאמנת הדיגיטלית"></canvas>
<button id="save" type="button" disabled>שמירת הסטורי</button>
<p id="note">בטלפון נפתח חלון שיתוף, ומשם אפשר לשתף ישר לסטטוס</p>

<script src="isha-card.js"></script>
<script>
(function () {
  'use strict';
  var D = window.IshaDesign, C = D.C;
  var SAMPLE = {
    title: 'מתלמידה אלופה שלי, תראו מה היא כתבה למאמנת הדיגיטלית',
    quote: 'היום הבנתי שאני לא צריכה להוכיח לו כלום. פשוט הייתי נוכחת, והוא התקרב לבד',
    botLine: 'איזה רגע. את מרגישה את ההבדל בגוף?',
    footer: 'אשה ללא מאמץ'
  };

  function encode(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj)), bin = '';
    bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function readData() {
    var d = new URLSearchParams(location.search).get('d');
    if (!d) return SAMPLE;
    try { var o = decode(d); return { title: o.title || '', quote: o.quote || '', botLine: o.botLine || '', footer: o.footer || SAMPLE.footer }; }
    catch (e) { return SAMPLE; }
  }

  // בועה: מלבן מעוגל עם פינה אחת חדה יותר בצד של הדוברת
  function bubble(ctx, x, y, w, h, side, fill, border) {
    var r = 40, k = 12;
    D.roundRect(ctx, x, y, w, h, side === 'right' ? [r, r, k, r] : [r, r, r, k]);
    ctx.save();
    ctx.shadowColor = 'rgba(13,18,44,.10)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    ctx.fillStyle = fill; ctx.fill();
    ctx.restore();
    if (border) { ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.stroke(); }
  }

  function circleImg(ctx, img, cx, cy, r) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.closePath();
    ctx.fillStyle = C.soft; ctx.fill(); ctx.clip();
    if (img) {
      var s = Math.max(2 * r / img.naturalWidth, 2 * r / img.naturalHeight);
      ctx.drawImage(img, cx - img.naturalWidth * s / 2, cy - img.naturalHeight * s / 2, img.naturalWidth * s, img.naturalHeight * s);
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(242,238,227,.9)'; ctx.lineWidth = 4; ctx.stroke();
  }

  // מודד בועה: מחזיר שורות, גודל ורוחב בפועל
  function measureBubble(ctx, str, maxTextW, maxH, max, min, weight) {
    var L = D.fitParas(ctx, D.cleanText(str, false), { w: maxTextW, h: maxH, weight: weight, max: max, min: min, lh: 1.42, paraGap: 0.45 });
    ctx.font = D.font(weight, L.size);
    var w = 0;
    L.paras.forEach(function (ls) { ls.forEach(function (l) { w = Math.max(w, ctx.measureText(l).width); }); });
    L.textW = w;
    return L;
  }

  function drawIshaStory(canvas, data, imgs) {
    var W = 1080, H = 1920, cx = W / 2;
    var ctx = D.prepare(canvas, W, H);
    ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
    D.cornerRibbon(ctx, W, 1);
    D.bottomBands(ctx, W, H, 1770);

    // לוגו למעלה, קטן ועדין
    var logo = D.placeCenter(ctx, imgs.logo, cx, 96, 270, 190);
    var y = logo.y + (logo.h || 190) + 64;

    // כותרת
    var T = D.fitParas(ctx, D.cleanText(data.title, false), { w: 860, h: 300, weight: 800, max: 76, min: 46, lh: 1.24, paraGap: 0.3 });
    y = D.drawParas(ctx, T, cx, y, C.ink, 800) + 56;

    // מסגרת השיחה
    var FX = 104, FW = W - 2 * FX, HEAD = 150, PAD = 46;
    var areaTop = y, areaBottom = 1540;
    var innerW = FW - 2 * PAD;

    var B = data.botLine ? measureBubble(ctx, data.botLine, innerW * 0.68 - 2 * 36, 240, 42, 30, 600) : null;
    var bH = B ? B.height + 2 * 30 : 0;
    // הציטוט מקבל את כל הגובה שנשאר; ארוך מדי - מוקטן, ובקצה נחתך בסוף משפט
    var qMax = (areaBottom - areaTop) - HEAD - 2 * PAD - 10 - (B ? 34 + bH : 0) - 2 * 34;
    var Q = measureBubble(ctx, data.quote, innerW * 0.80 - 2 * 38, Math.min(760, qMax), 50, 32, 600);
    var qH = Q.height + 2 * 34;
    var bodyH = PAD + qH + (B ? 34 + bH : 0) + PAD + 10;
    var FH = Math.min(HEAD + bodyH, areaBottom - areaTop);
    var FY = areaTop + Math.max(0, (areaBottom - areaTop - FH) / 2) * 0.6;

    // המסך: יריעת קרם רכה עם צל, כמו טלפון מונח על נייר
    ctx.save();
    ctx.translate(cx, FY + FH / 2); ctx.rotate(-0.012); ctx.translate(-cx, -(FY + FH / 2));
    D.roundRect(ctx, FX, FY, FW, FH, 56);
    ctx.save();
    ctx.shadowColor = 'rgba(13,18,44,.20)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18;
    ctx.fillStyle = C.soft; ctx.fill();
    ctx.restore();
    ctx.save(); ctx.clip();

    // כותרת השיחה, כחול לילה
    ctx.fillStyle = C.ink; ctx.fillRect(FX, FY, FW, HEAD);
    var avR = 46, avX = FX + FW - PAD - avR, avY = FY + HEAD / 2;
    circleImg(ctx, imgs.avatar, avX, avY, avR);
    var nameX = avX - avR - 26;
    D.text(ctx, 'המאמנת הדיגיטלית', nameX, avY + 2, 700, 42, C.cream, 'right');
    D.text(ctx, 'אשה ללא מאמץ', nameX, avY + 44, 400, 28, 'rgba(242,238,227,.72)', 'right');
    // נקודה כתומה אחת - ״מחוברת״
    ctx.fillStyle = C.orange; ctx.beginPath(); ctx.arc(avX - avR * 0.72, avY + avR * 0.72, 10, 0, Math.PI * 2); ctx.fill();

    // בועת התלמידה - מימין, סגול, כמו בבוטית
    var by = FY + HEAD + PAD;
    var qW = Q.textW + 2 * 38, qX = FX + FW - PAD - qW;
    bubble(ctx, qX, by, qW, qH, 'right', C.purple);
    D.drawParas(ctx, Q, qX + qW - 38, by + 34, C.cream, 600, 'right');
    by += qH;

    // תשובת הבוטית - משמאל, קרם, עם האווטאר
    if (B) {
      by += 34;
      var aR = 30, bX = FX + PAD + 2 * aR + 16, bW = B.textW + 2 * 36;
      bubble(ctx, bX, by, bW, bH, 'left', C.cream, 'rgba(13,18,44,.09)');
      D.drawParas(ctx, B, bX + bW - 36, by + 30, C.ink, 600, 'right');
      circleImg(ctx, imgs.avatar, FX + PAD + aR, by + bH - aR, aR);
    }
    ctx.restore();
    ctx.restore();

    // שורת תחתית על היריעה החלקה
    D.text(ctx, data.footer || 'אשה ללא מאמץ', cx, 1866, 700, 42, C.purple, 'center', 1);
    canvas.__layout = { titleSize: T.size, quoteSize: Q.size, botSize: B ? B.size : 0, frameTop: FY, frameBottom: FY + FH, overflow: HEAD + bodyH > areaBottom - areaTop };
    return canvas;
  }

  async function save(canvas, btn) {
    btn.disabled = true;
    var blob = await new Promise(function (r) { canvas.toBlob(r, 'image/png'); });
    var name = 'סטורי-אשה-ללא-מאמץ.png', file = new File([blob], name, { type: 'image/png' });
    var touch = matchMedia('(pointer:coarse)').matches;
    if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) { /* ביטול שיתוף */ }
    } else {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }
    btn.disabled = false;
  }

  window.IshaStory = { encode: encode, decode: decode, draw: drawIshaStory, SAMPLE: SAMPLE };

  var canvas = document.getElementById('story'), btn = document.getElementById('save');
  // עדות אמיתית: ?id=&s= - הנתונים מגיעים מהמנוע, רק לעדות שהתלמידה אישרה לשתף.
  var EXEC = 'https://script.google.com/macros/s/AKfycbxEb_XsEFb8JmHZhTeb72kCIjnrSLJECk2mbXJ48UrTfsfO5nVBC_ItuRqcLsbxRhc/exec';
  function loadData() {
    var q = new URLSearchParams(location.search), id = q.get('id');
    if (!id) return Promise.resolve(readData());
    var ex = q.get('x') ? 'https://script.google.com/macros/s/' + q.get('x').replace(/[^\w-]/g, '') + '/exec' : EXEC;
    return fetch(ex + '?story=' + encodeURIComponent(id) + '&s=' + encodeURIComponent(q.get('s') || ''), {redirect: 'follow'})
      .then(function (r) { return r.json(); })
      .then(function (o) {
        if (!o || !o.ok) { document.body.insertAdjacentHTML('afterbegin', '<p style="text-align:center;padding:16px">הסטורי הזה לא זמין.</p>'); return null; }
        return { title: o.name ? o.name + ', תלמידה אלופה שלי, כתבה את זה למאמנת הדיגיטלית' : 'תראו מה תלמידה אלופה שלי כתבה למאמנת הדיגיטלית שלנו',
                 quote: o.quote, botLine: o.bot || '', footer: SAMPLE.footer };
      });
  }
  window.IshaStory.done = Promise.all([D.ready(), D.loadImg('img/logo.png'), D.loadImg('img/coach-avatar.jpg'), loadData()])
    .then(function (r) {
      if (!r[3]) return;
      drawIshaStory(canvas, r[3], { logo: r[1], avatar: r[2] });
      btn.disabled = false;
      btn.addEventListener('click', function () { save(canvas, btn); });
    });
})();
</script>
</body>
</html>
