<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המאמנת האישית שלך | שושי זליקוביץ׳</title>
<meta name="description" content="הליווי האישי של אשה ללא מאמץ - ממגנטת ויודעת. לתלמידות הקורס בלבד.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2EEE3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23A62F7D'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23F2EEE3' font-family='sans-serif'%3E%D7%A9%3C/text%3E%3C/svg%3E">
<style>
  :root{ --cream:#F2EEE3; --purple:#A62F7D; }
  html,body{ margin:0; padding:0; height:100%; background:var(--cream); }
  body{ overflow:hidden; }
  #bot{
    position:fixed; inset:0;
    width:100%; height:100%; height:100dvh;
    border:0; display:block;
  }
  /* נראה רק בשנייה שלפני שהבוט נטען */
  #loading{
    position:fixed; inset:0; display:flex; gap:7px;
    align-items:center; justify-content:center;
    background:var(--cream); z-index:2;
    transition:opacity .4s;
  }
  #loading i{
    width:9px; height:9px; border-radius:50%;
    background:var(--purple); opacity:.3;
    animation:pulse 1.3s infinite;
  }
  #loading i:nth-child(2){ animation-delay:.18s }
  #loading i:nth-child(3){ animation-delay:.36s }
  @keyframes pulse{
    0%,60%,100%{ opacity:.25; transform:translateY(0) }
    30%{ opacity:.85; transform:translateY(-4px) }
  }
</style>
</head>
<body>

<div id="loading"><i></i><i></i><i></i></div>

<iframe id="bot"
  title="המאמנת האישית שלך"
  src="https://script.google.com/macros/s/AKfycbxEb_XsEFb8JmHZhTeb72kCIjnrSLJECk2mbXJ48UrTfsfO5nVBC_ItuRqcLsbxRhc/exec"
  allow="clipboard-write"></iframe>

<script>
  var f = document.getElementById('bot'), l = document.getElementById('loading');
  function done(){ l.style.opacity = 0; setTimeout(function(){ l.remove(); }, 450); }
  f.addEventListener('load', done);
  setTimeout(done, 9000);
</script>

</body>
</html>
