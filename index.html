<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שושי זליקוביץ׳</title>
<meta name="theme-color" content="#F2EEE3">
<style>
  :root{ --cream:#F2EEE3; --ink:#0D122C; --purple:#A62F7D; }
  *{ box-sizing:border-box }
  body{
    margin:0; min-height:100vh; background:var(--cream); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-weight:300;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px; text-align:center; line-height:1.8;
  }
  h1{ font-size:27px; font-weight:700; color:var(--purple); margin:0 0 10px }
  p{ margin:0; opacity:.7; font-size:16px }
</style>
<script>
  // קישור כניסה ממייל של ״לשחק את השינוי״ שנחת בדף הבית: מעבירים לאפליקציה עם כל מה שבכתובת
  (function(){ var h = location.hash || '', q = location.search || '';
    if (/access_token=|error_code=|error=|type=(magiclink|recovery|signup|invite)/.test(h + q) || /[?&]code=/.test(q))
      location.replace('/shinui/' + q + h); })();
</script>
</head>
<body>
  <div>
    <h1>שושי זליקוביץ׳</h1>
    <p>זוגיות והורות בטוחה</p>
  </div>
</body>
</html>
